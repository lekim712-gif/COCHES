# Despliegue manual a Hostinger por FTP. Solo se ejecuta cuando tú lo lanzas (Actions → Run workflow).
# Requiere los secretos descritos en docs/DESPLIEGUE-HOSTINGER.md.
name: Desplegar en Hostinger

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir (falla si falta algún dato obligatorio)
        run: npm run build:prod
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_OWNER_NAME: ${{ secrets.PUBLIC_OWNER_NAME }}
          PUBLIC_OWNER_TAXID: ${{ secrets.PUBLIC_OWNER_TAXID }}
          PUBLIC_OWNER_ADDRESS: ${{ secrets.PUBLIC_OWNER_ADDRESS }}
          PUBLIC_REVIEWER_NAME: ${{ secrets.PUBLIC_REVIEWER_NAME }}
          PUBLIC_REVIEWER_EXPERIENCE: ${{ secrets.PUBLIC_REVIEWER_EXPERIENCE }}
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSLOT_1: ${{ secrets.PUBLIC_ADSLOT_1 }}
          PUBLIC_ADSLOT_2: ${{ secrets.PUBLIC_ADSLOT_2 }}
          PUBLIC_AMAZON_TAG: ${{ secrets.PUBLIC_AMAZON_TAG }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_INDEX_UNREVIEWED: ${{ secrets.PUBLIC_INDEX_UNREVIEWED }}
      - name: Subir dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # IMPORTANTE: carpeta de ESTE dominio únicamente (nunca la de otra web). Ver docs/DESPLIEGUE-HOSTINGER.md
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # No borra nada que este despliegue no haya subido antes (no toca otras webs).
          dangerous-clean-slate: false
